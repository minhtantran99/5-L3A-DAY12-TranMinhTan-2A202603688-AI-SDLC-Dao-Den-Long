<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đảo Đèn Lồng — Three.js</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, -apple-system, sans-serif; color: #F5F1E6; font-size: 18px; }
    body.large-text { font-size: 22.5px; }
    body.large-text .hud-top, body.large-text .prompt, body.large-text #overlay p, body.large-text .settings-panel { font-size: 22.5px; }
    #hud { position: fixed; inset: 0; pointer-events: none; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; font-size: 18px; font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
    .hud-box { background: rgba(14, 20, 48, 0.78); border: 1px solid rgba(242, 193, 78, 0.45); border-radius: 10px; padding: 8px 14px; }
    .hud-timer.danger { color: #FF5A5F; animation: pulse 0.8s infinite; }
    .hud-timer.danger.cb { color: #FFFFFF; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
    .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    .mote-bar { display: flex; gap: 4px; }
    .mote-slot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #FFE58A; background: rgba(255,255,255,0.08); }
    .mote-slot.filled { background: #FFF6C2; box-shadow: 0 0 8px #FFE58A; }
    .prompt { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: rgba(14, 20, 48, 0.88); border: 1px solid #F2C14E; border-radius: 8px; padding: 6px 14px; font-size: 18px; display: none; }
    #lantern-arrow { position: fixed; font-size: 24px; color: #F2C14E; font-weight: 900; pointer-events: none; display: none; text-shadow: 0 0 8px #FFB347; }
    #overlay { position: fixed; inset: 0; background: rgba(14, 20, 48, 0.9); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
    #overlay.hidden { display: none; }
    #overlay h1 { color: #F2C14E; font-size: 34px; }
    #overlay p { max-width: 560px; line-height: 1.5; font-size: 18px; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn { pointer-events: auto; background: #FFB347; color: #0E1430; border: none; border-radius: 10px; padding: 10px 22px; font-size: 18px; font-weight: 700; cursor: pointer; }
    .btn:hover { background: #FFE9B0; }
    .btn.secondary { background: #1B2350; color: #F5F1E6; border: 1px solid #F2C14E; }
    .settings-panel { display: none; flex-direction: column; gap: 10px; background: rgba(27, 35, 80, 0.85); padding: 16px 24px; border-radius: 12px; border: 1px solid #F2C14E; font-size: 18px; max-height: 60vh; overflow-y: auto; text-align: left; }
    .settings-panel.open { display: flex; }
    .keybind-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; font-size: 16px; }
    .kb-btn { background: #0E1430; color: #F5F1E6; border: 1px solid #F2C14E; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 15px; }
    #lb-box { display: none; flex-direction: column; gap: 8px; background: rgba(27, 35, 80, 0.88); padding: 16px 24px; border-radius: 12px; border: 1px solid #F2C14E; min-width: 360px; max-width: 90vw; text-align: left; font-size: 18px; }
    #lb-box.open { display: flex; }
    #subtitle-bar { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); background: rgba(14, 20, 48, 0.85); border: 1px solid #F2C14E; border-radius: 8px; padding: 4px 14px; font-size: 18px; display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="hud-top">
      <div class="hud-box" id="hud-flames">Ngọn Lửa: 3</div>
      <div class="hud-box hud-timer" id="hud-timer">05:00</div>
      <div class="hud-box" id="hud-score">Đèn: 0/5 · Điểm: 0</div>
    </div>
    <div id="lantern-arrow">➤</div>
    <div id="subtitle-bar"></div>
    <div class="prompt" id="hud-prompt">E — Nạp ánh sáng (0/10)</div>
    <div class="hud-bottom">
      <div class="hud-box" style="font-size: 14px;">WASD: Di chuyển · Space: Nhảy · Shift: Lướt · E: Nạp đèn · Q: Tỏa Sáng · Esc/P: Tạm dừng</div>
      <div class="hud-box">
        <div style="font-size: 14px; margin-bottom: 4px;" id="hud-carried-text">Đom đóm: 0/10</div>
        <div class="mote-bar" id="hud-motes"></div>
      </div>
      <div class="hud-box" id="hud-skills">Lướt: Sẵn sàng · Tỏa Sáng: Sẵn sàng</div>
    </div>
  </div>
  <div id="overlay">
    <h1 id="overlay-title">Đảo Đèn Lồng</h1>
    <p id="overlay-desc">Hành trình 3 Đêm cùng Mây thắp sáng Đảo Bến, Đảo Cau và Đảo Chuông.</p>
    <div class="settings-panel" id="settings-panel">
      <label>Âm lượng: <input type="range" id="opt-vol" min="0" max="1" step="0.05" value="0.5" /></label>
      <label>Độ nhạy chuột: <input type="range" id="opt-sens" min="0.05" max="0.6" step="0.05" value="0.25" /></label>
      <label><input type="checkbox" id="opt-cb" /> Bảng màu dễ phân biệt</label>
      <label><input type="checkbox" id="opt-motion" /> Giảm chuyển động</label>
      <label><input type="checkbox" id="opt-large" /> Chữ lớn (×1.25)</label>
      <div class="keybind-grid" id="keybind-grid"></div>
      <div id="keybind-warn" style="color: #FF5A5F; font-size: 15px;"></div>
      <button class="btn secondary" id="btn-reset-keys" style="font-size:15px; padding:6px 12px;">Khôi phục mặc định</button>
    </div>
    <div id="lb-box"></div>
    <div class="btn-row" id="overlay-actions"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
